                      <thead className="bg-white/[0.03] text-[9.5px] font-semibold uppercase tracking-[0.12em] text-slate-500">
                        <tr>
                          {section.table.headers.map((header) => (
                            <th key={header} className="px-3.5 py-2.5 font-semibold">{header}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/[0.05]">
                        {section.table.rows.map((row, rowIndex) => (
                          <tr key={rowIndex} className="transition-colors hover:bg-white/[0.02]">
                            {row.map((cell, cellIndex) => (
                              <td
                                key={cellIndex}
                                className={
                                  'px-3.5 py-2.5 ' +
                                  (cellIndex === 0 ? 'font-medium text-slate-200' : 'text-slate-400')

                                {cell}

                    <div className="break-all text-slate-500">{section.example.from}</div>
                    <div className="mt-1.5 flex items-start gap-2">
                      <Icon name="arrowRight" className="mt-0.5 h-3.5 w-3.5 shrink-0" />
                      <span className="break-all font-semibold" style={{ color: accent }}>{section.example.to}</span>

                  </div>

                {section.note && (
                  <div className="mt-4 border-l-2 pl-3 text-[12px] leading-relaxed text-slate-500" style={{ borderColor: alpha(accent, '66') }}>
                    {section.note}
                  </div>
                )}
              </article>
            ))}
          </div>

          <div className="mt-4 rounded-2xl border border-white/[0.07] bg-white/[0.015] p-4 sm:p-5">
            <div className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.16em] text-slate-500">
              <Icon name="zap" className="h-3.5 w-3.5" style={{ color: accent }} />
              Micro-repaso
            </div>
            <div className="mt-3 flex flex-wrap gap-2">
              {module.chips.map((chip) => (
                <span
                  key={chip}
                  className="rounded-full border px-2.5 py-1 text-[11px] font-medium"
                  style={{ borderColor: alpha(accent, '33'), backgroundColor: alpha(accent, '0D'), color: '#CBD5E1' }}
                >
                  {chip}
                </span>
              ))}
            </div>
          </div>

          <div className="mt-4 rounded-2xl border border-dashed border-white/15 bg-white/[0.015] p-5">
            <div className="flex items-start gap-3">
              <div className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-white/[0.05] text-amber-300/90">
                <Icon name="lightbulb" className="h-[18px] w-[18px]" />
              </div>
              <div>
                <h3 className="text-[14px] font-semibold text-white">Tu turno: explícalo como si tuvieras 12 años</h3>
                <p className="mt-0.5 text-[11px] leading-relaxed text-slate-500">
                  Sin palabras técnicas. Si te trabas, vuelve a la analogía. Se guarda automáticamente.
                </p>
              </div>
            </div>
            <textarea
              value={feynman}
              onChange={(event) => onFeynman(event.target.value)}
              rows={4}
              placeholder={module.feynmanPrompt}
              className="mt-3 w-full resize-y rounded-xl border border-white/10 bg-black/30 px-3.5 py-3 text-[13px] leading-relaxed text-slate-200 placeholder:text-slate-600 focus:border-white/25 focus:outline-none focus:ring-2 focus:ring-white/[0.06]"
            />
            <div className="mt-1 flex items-center justify-between text-[10px] text-slate-600">
              <span>Técnica Feynman · explicar para entender</span>
              <span className="tabular-nums">{feynman.trim().length} caracteres</span>
            </div>
          </div>

          <div className="mt-5 flex flex-wrap items-center gap-3">
            {watchedTheory ? (
              <span className="inline-flex items-center gap-2 rounded-xl bg-emerald-400/10 px-4 py-2.5 text-[13px] font-medium text-emerald-300 ring-1 ring-inset ring-emerald-400/20">
                <Icon name="check" className="h-4 w-4" /> Teoría completada
              </span>

              <button
                onClick={onMark}
                className="inline-flex items-center gap-2 rounded-xl px-4 py-2.5 text-[13px] font-semibold text-[#05080C] transition hover:brightness-110 active:scale-[0.99]"
                style={{ backgroundColor: accent }}
              >
                Ya lo entendí <Icon name="arrowRight" className="h-4 w-4" />
              </button>
            )}
            <span className="text-[11px] text-slate-600">Marca este paso para avanzar en tu ruta.</span>
          </div>
        </section>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  Video                                                              */
    /* ------------------------------------------------------------------ */

    function VideoSection({ module, watched, onWatched }) {
      const accent = module.accent;
      const videos = module.videos || [];
      const [index, setIndex] = useState(0);
      const [failed, setFailed] = useState(false);
      const videoRef = useRef(null);
      const current = videos[index];

      useEffect(() => {
        setFailed(false);
        if (!current) return;

        const timer = setTimeout(() => {
          const element = videoRef.current;
          if (element && element.readyState === 0) setFailed(true);
        }, 5000);

        return () => clearTimeout(timer);
      }, [index, current ? current.src : '']);

      function selectVideo(nextIndex) {
        setIndex(nextIndex);
        setFailed(false);
      }

      return (
        <section className="pt-10">
          <SectionHeading
            id="video"
            n="02"
            title="Video de la clase"
            subtitle={module.videoOptional
              ? 'Aún no hay grabación para este tema. Puedes avanzar sin ella; el video es un extra.'
              : 'Mira, pausa y anota una idea nueva. Puedes marcar el paso al terminar.'}
            done={watched}
            accent={accent}
          />

          <div className="mt-5 rounded-3xl border border-white/[0.07] bg-white/[0.02] p-3 sm:p-4">
            {videos.length > 1 && (
              <div className="mb-3 flex flex-wrap gap-2 px-0.5">
                {videos.map((video, videoIndex) => {
                  const selected = videoIndex === index;
                  return (
                    <button
                      key={video.src}
                      onClick={() => selectVideo(videoIndex)}
                      className={
                        'inline-flex items-center gap-2 rounded-lg border px-3 py-1.5 text-[11px] font-medium transition ' +
                        (selected ? '' : 'border-white/10 bg-transparent text-slate-500 hover:border-white/20 hover:text-slate-300')
                      }
                      style={selected ? { borderColor: alpha(accent, '55'), backgroundColor: alpha(accent, '14'), color: accent } : undefined}
                    >
                      <Icon name="video" className="h-3.5 w-3.5" />
                      {video.label}
                      <span className="text-[9px] uppercase tracking-wider opacity-60">{video.tag}</span>
                    </button>
                  );
                })}
              </div>
            )}

            <div className="relative overflow-hidden rounded-2xl border border-white/10 bg-black">
              {current && !failed ? (
                <video
                  key={current.src}
                  ref={videoRef}
                  controls
                  playsInline
                  preload="metadata"
                  className="aspect-video w-full bg-black"
                  onLoadedMetadata={() => setFailed(false)}
                  onEnded={onWatched}
                  onError={() => setFailed(true)}
                >
                  <source src={current.src} type="video/mp4" />
                  Tu navegador no soporta el reproductor HTML5.
                </video>
              ) : (
                <div
                  className="flex aspect-video w-full flex-col items-center justify-center gap-4 px-6 text-center"
                  style={{ background: 'radial-gradient(circle at 50% 28%, ' + alpha(accent, '1A') + ', #05080C 72%)' }}
                >
                  <div
                    className="grid h-14 w-14 place-items-center rounded-2xl border"
                    style={{ borderColor: alpha(accent, '40'), backgroundColor: alpha(accent, '12'), color: accent }}
                  >
                    <Icon name="video" className="h-6 w-6" />
                  </div>
                  <div>
                    <p className="text-[14px] font-semibold text-slate-200">
                      {module.videoOptional ? 'Video todavía no disponible' : 'No se pudo cargar el video'}
                    </p>
                    <p className="mx-auto mt-1.5 max-w-md text-[12px] leading-relaxed text-slate-500">
                      {module.videoOptional ? (
                        <>Coloca el archivo <code className="rounded bg-white/[0.06] px-1.5 py-0.5 font-mono text-[11px] text-slate-300">video4-qos.mp4</code> en esta carpeta y recarga la página. Mientras tanto, el paso no cuenta para tu progreso.</>
                      ) : (
                        <>Verifica que el archivo esté en esta misma carpeta y que sea un MP4 compatible (H.264).</>
                      )}
                    </p>
                  </div>
                </div>
              )}
            </div>

            <div className="mt-3 flex flex-wrap items-center justify-between gap-3 px-1">
              <div className="flex items-center gap-2 text-[11px] text-slate-500">
                <span className={'h-1.5 w-1.5 rounded-full ' + (current && !failed ? 'bg-rose-400' : 'bg-slate-600')} />
                {current ? current.label : 'Sin grabación'}
                {watched && (
                  <span className="ml-1 inline-flex items-center gap-1 rounded-full bg-emerald-400/10 px-2 py-0.5 text-[10px] font-medium text-emerald-300 ring-1 ring-inset ring-emerald-400/20">
                    <Icon name="check" className="h-2.5 w-2.5" /> Visto
                  </span>
                )}
              </div>

              {!failed && current && (
                watched ? (
                  <span className="inline-flex items-center gap-1.5 text-[11px] font-medium text-emerald-300">
                    <Icon name="check" className="h-3.5 w-3.5" /> Video marcado como visto
                  </span>
                ) : (
                  <button
                    onClick={onWatched}
                    className="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.04] px-3.5 py-2 text-[11.5px] font-medium text-slate-200 transition hover:border-white/20 hover:bg-white/[0.07]"
                  >
                    <Icon name="check" className="h-3.5 w-3.5" /> Marcar video como visto
                  </button>
                )
              )}
            </div>

            {module.videoOptional && (
              <p className="mt-2 px-1 text-[10px] leading-relaxed text-slate-600">
                Este tema se puede completar con la teoría y la práctica. El video aparece automáticamente cuando agregues el archivo.
              </p>
            )}
          </div>
        </section>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  Práctica (Active Recall)                                           */
    /* ------------------------------------------------------------------ */

    function QuizSection({ module, bestScore, onScore }) {
      const accent = module.accent;
      const questions = module.quiz;
      const [answers, setAnswers] = useState(() => questions.map(() => null));

      const answeredCount = answers.filter((answer) => answer !== null).length;
      const allAnswered = answeredCount === questions.length;
      const score = answers.reduce((total, answer, index) => total + (answer === questions[index].answer ? 1 : 0), 0);

      function selectOption(questionIndex, optionIndex) {
        if (answers[questionIndex] !== null) return;

        const next = answers.map((answer, index) => (index === questionIndex ? optionIndex : answer));
        setAnswers(next);

        if (next.every((answer) => answer !== null)) {
          const finalScore = next.reduce(
            (total, answer, index) => total + (answer === questions[index].answer ? 1 : 0),
            0
          );
          onScore(finalScore);
        }
      }

      function retry() {
        setAnswers(questions.map(() => null));
      }

      const message = score === questions.length
        ? 'Perfecto. Puedes explicar este tema sin mirar apuntes: sigue con el siguiente módulo.'
        : score >= PASS_SCORE
          ? 'Buen dominio. Repasa la que falló y avanza cuando puedas contarla con tus palabras.'
          : 'Todavía no. Vuelve a la analogía, mira el video y repite la práctica. Fallar aquí es parte de aprender.';

      return (
        <section className="pt-10">
          <div className="flex flex-wrap items-end justify-between gap-3">
            <SectionHeading
              id="practica"
              n="03"
              title="Práctica · Active Recall"
              subtitle="Responde sin mirar arriba. La corrección y la justificación aparecen al instante."
              done={bestScore !== null && bestScore >= PASS_SCORE}
              accent={accent}
            />
            <div className="mb-1 flex items-center gap-2">
              {bestScore !== null && (
                <span className="rounded-full border border-white/10 bg-white/[0.03] px-2.5 py-1 text-[10px] font-medium text-slate-500">
                  Mejor: {bestScore}/{questions.length}
                </span>
              )}
              <span
                className="rounded-full px-2.5 py-1 text-[10px] font-semibold tabular-nums"
                style={{ backgroundColor: alpha(accent, '14'), color: accent }}
              >
                {answeredCount}/{questions.length} respondidas
              </span>
            </div>
          </div>

          <div className="mt-5 space-y-3.5">
            {questions.map((question, questionIndex) => {
              const picked = answers[questionIndex];
              const isAnswered = picked !== null;
              const isCorrect = picked === question.answer;

              return (
                <article key={questionIndex} className="rounded-2xl border border-white/[0.07] bg-white/[0.02] p-5 sm:p-5">
                  <div className="flex items-start justify-between gap-3">
                    <h3 className="text-[13.5px] font-medium leading-relaxed text-slate-200 sm:text-[14px]">
                      <span className="mr-2 font-mono text-[10px] text-slate-600">0{questionIndex + 1}</span>
                      {question.question}
                    </h3>
                    {isAnswered && (
                      <span
                        className={
                          'inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-1 text-[9px] font-bold uppercase tracking-wider ring-1 ring-inset ' +
                          (isCorrect
                            ? 'bg-emerald-400/10 text-emerald-300 ring-emerald-400/20'
                            : 'bg-rose-400/10 text-rose-300 ring-rose-400/20')
                        }
                      >
                        <Icon name={isCorrect ? 'check' : 'x'} className="h-2.5 w-2.5" />
                        {isCorrect ? 'Correcto' : 'Incorrecto'}
                      </span>
                    )}
                  </div>

                  <div className="mt-3.5 grid gap-2">
                    {question.options.map((option, optionIndex) => {
                      const showResult = isAnswered;
                      const isRight = question.answer === optionIndex;
                      const isPicked = picked === optionIndex;
                      const letter = ['A', 'B', 'C', 'D'][optionIndex];

                      let container = 'border-white/[0.08] bg-white/[0.015] hover:border-white/20 hover:bg-white/[0.035]';
                      if (showResult && isRight) container = 'border-emerald-400/40 bg-emerald-400/[0.07]';
                      else if (showResult && isPicked) container = 'border-rose-400/40 bg-rose-400/[0.07]';
                      else if (showResult) container = 'border-white/[0.05] bg-transparent opacity-45';

                      let badge = 'border-white/10 bg-white/[0.04] text-slate-400';
                      if (showResult && isRight) badge = 'border-emerald-400/30 bg-emerald-400/15 text-emerald-300';
                      else if (showResult && isPicked) badge = 'border-rose-400/30 bg-rose-400/15 text-rose-300';

                      return (
                        <button
                          key={optionIndex}
                          onClick={() => selectOption(questionIndex, optionIndex)}
                          disabled={showResult}
                          aria-pressed={isPicked}
                          className={
                            'flex items-center gap-3 rounded-xl border px-3.5 py-2.5 text-left text-[12.5px] leading-relaxed transition ' +
                            container +
                            (showResult ? ' cursor-default' : ' cursor-pointer')
                          }
                        >
                          <span className={'grid h-6 w-6 shrink-0 place-items-center rounded-md border text-[10px] font-bold ' + badge}>
                            {letter}
                          </span>
                          <span className={'flex-1 ' + (showResult && !isRight && !isPicked ? 'text-slate-500' : 'text-slate-300')}>
                            {option}
                          </span>
                          {showResult && isRight && <Icon name="check" className="h-4 w-4 shrink-0 text-emerald-400" />}
                          {showResult && isPicked && !isRight && <Icon name="x" className="h-4 w-4 shrink-0 text-rose-400" />}
                        </button>
                      );
                    })}
                  </div>

                  {isAnswered && (
                    <div className="mt-3 animate-fade rounded-xl border border-white/[0.06] bg-black/25 px-3.5 py-3 text-[11.5px] leading-relaxed text-slate-400">
                      <span className="font-semibold text-slate-300">¿Por qué? </span>
                      {question.why}
                    </div>
                  )}
                </article>
              );
            })}
          </div>

          {allAnswered && (
            <div className="mt-4 animate-rise overflow-hidden rounded-2xl border border-white/[0.08] bg-white/[0.025]">
              <div className="flex flex-wrap items-center gap-4 p-5">
                <div
                  className="grid h-16 w-16 shrink-0 place-items-center rounded-2xl border"
                  style={{
                    borderColor: score >= PASS_SCORE ? 'rgba(52,211,153,.3)' : 'rgba(251,113,133,.3)',
                    backgroundColor: score >= PASS_SCORE ? 'rgba(52,211,153,.1)' : 'rgba(251,113,133,.1)'
                  }}
                >
                  <div className="text-center">
                    <span className={'block text-xl font-extrabold leading-none ' + (score >= PASS_SCORE ? 'text-emerald-300' : 'text-rose-300')}>
                      {score}/{questions.length}
                    </span>
                    <span className="mt-1 block text-[8px] font-bold uppercase tracking-wider text-slate-500">puntaje</span>
                  </div>
                </div>
                <div className="min-w-0 flex-1">
                  <h3 className="text-[14px] font-semibold text-white">
                    {score === questions.length ? 'Dominio completo' : score >= PASS_SCORE ? 'Práctica superada' : 'Necesitas otro repaso'}
                  </h3>
                  <p className="mt-0.5 text-[11.5px] leading-relaxed text-slate-500">{message}</p>
                </div>
                <button
                  onClick={retry}
                  className="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.04] px-3.5 py-2 text-[11.5px] font-medium text-slate-200 transition hover:border-white/20 hover:bg-white/[0.07]"
                >
                  <Icon name="rotate" className="h-3.5 w-3.5" /> Reintentar
                </button>
              </div>
              <div className="h-1 w-full bg-white/[0.06]">
                <div
                  className="h-full transition-all duration-700"
                  style={{
                    width: (score / questions.length) * 100 + '%',
                    backgroundColor: score >= PASS_SCORE ? '#34D399' : '#FB7185'
                  }}
                />
              </div>
            </div>
          )}

          <p className="mt-4 flex items-start gap-2 text-[10.5px] leading-relaxed text-slate-600">
            <Icon name="lightbulb" className="mt-0.5 h-3 w-3 shrink-0" />
            Active Recall: intentar recordar sin mirar fortalece la memoria mucho más que releer. Si fallas, vuelve a la analogía y reintenta.
          </p>
        </section>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  Módulo completo                                                    */
    /* ------------------------------------------------------------------ */

    function ModuleView({ module, status, progress, actions }) {
      const accent = module.accent;
      const index = MODULES.findIndex((item) => item.id === module.id);
      const previous = MODULES[index - 1];
      const next = MODULES[index + 1];

      const steps = [
        { key: 'theory', n: '01', label: 'Teoría', icon: 'book', target: 'teoria' },
        { key: 'video', n: '02', label: 'Video', icon: 'video', target: 'video' },
        { key: 'quiz', n: '03', label: 'Práctica', icon: 'target', target: 'practica' }
      ];

      const currentKey = steps
        .filter((step) => status.requiredKeys.indexOf(step.key) !== -1)
        .find((step) => !status[step.key])?.key;

      function scrollTo(id) {
        const element = document.getElementById(id);
        if (element) element.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      return (
        <div className="animate-rise">
          <div className="flex flex-wrap items-center gap-2">
            <span
              className="rounded-full px-2.5 py-1 text-[9px] font-bold uppercase tracking-[0.16em]"
              style={{ backgroundColor: alpha(accent, '16'), color: accent, boxShadow: 'inset 0 0 0 1px ' + alpha(accent, '30') }}
            >
              Módulo {module.n}
            </span>
            <span className="text-[9.5px] font-semibold uppercase tracking-[0.18em] text-slate-600">
              Redes 2 · {module.short}
            </span>
          </div>

          <h1 className="mt-3 max-w-3xl text-[30px] font-extrabold leading-[1.15] tracking-[-0.02em] text-white sm:text-[38px] md:text-[42px]">
            {module.title}
          </h1>
          <p className="mt-2 max-w-2xl text-[13.5px] leading-relaxed text-slate-400 sm:text-[14.5px]">
            {module.tagline} <span className="text-slate-600">{module.intro}</span>
          </p>

          <div className="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2 text-[10.5px] text-slate-500">
            <span className="inline-flex items-center gap-1.5"><Icon name="clock" className="h-3.5 w-3.5" /> {module.duration} de estudio</span>
            <span className="inline-flex items-center gap-1.5"><Icon name="layers" className="h-3.5 w-3.5" /> {status.total} pasos guiados{module.videoOptional ? ' + video opcional' : ''}</span>
            <span className="inline-flex items-center gap-1.5"><Icon name="target" className="h-3.5 w-3.5" /> Práctica de 3 preguntas</span>
          </div>

          <div className="mt-5 grid gap-2 sm:grid-cols-3">
            {steps.map((step) => {
              const done = status[step.key];
              const isCurrent = step.key === currentKey && !done;
              const optional = step.key === 'video' && module.videoOptional;
              const optionalMissing = optional && !done;

              return (
                <button
                  key={step.key}
                  onClick={() => scrollTo(step.target)}
                  className={
                    'group flex items-center gap-3 rounded-xl border px-3 py-2.5 text-left transition ' +
                    (done
                      ? 'border-emerald-400/20 bg-emerald-400/[0.045]'
                      : isCurrent
                        ? 'bg-white/[0.035] hover:bg-white/[0.05]'
                        : optionalMissing
                          ? 'border-white/[0.05] bg-white/[0.012] hover:bg-white/[0.025]'
                          : 'border-white/[0.06] bg-white/[0.015] opacity-60 hover:opacity-100')
                  }
                  style={isCurrent ? { borderColor: alpha(accent, '55') } : undefined}
                >
                  <span
                    className="grid h-8 w-8 shrink-0 place-items-center rounded-lg"
                    style={
                      done
                        ? { backgroundColor: 'rgba(52,211,153,.12)', color: '#6EE7B7' }
                        : isCurrent
                          ? { backgroundColor: alpha(accent, '16'), color: accent }
                          : { backgroundColor: 'rgba(255,255,255,.04)', color: '#64748B' }
                    }
                  >
                    <Icon name={done ? 'check' : step.icon} className="h-4 w-4" />
                  </span>
                  <span className="min-w-0">
                    <span className="block text-[8.5px] font-bold uppercase tracking-[0.16em] text-slate-600">Paso {step.n}</span>
                    <span className="block truncate text-[12.5px] font-semibold text-slate-200">{step.label}</span>
                  </span>
                  <span
                    className={
                      'ml-auto shrink-0 text-[9px] font-bold uppercase tracking-wider ' +
                      (done ? 'text-emerald-400/80' : isCurrent ? '' : 'text-slate-600')
                    }
                    style={isCurrent ? { color: accent } : undefined}
                  >
                    {done ? 'Listo' : optionalMissing ? (status.video ? 'Listo' : 'Opcional') : isCurrent ? 'Ahora' : 'Pendiente'}
                  </span>
                </button>
              );
            })}
          </div>

          <div className="mt-5 rounded-2xl border border-white/[0.07] bg-white/[0.015] p-4 sm:p-5">
            <div className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.16em] text-slate-500">
              <Icon name="book" className="h-3.5 w-3.5" style={{ color: accent }} />
              Recursos de la clase
            </div>
            <p className="mt-1.5 text-[11.5px] leading-relaxed text-slate-500">
              Abre la guía y las diapositivas de este tema. Los archivos deben estar en la misma carpeta que <code className="rounded bg-white/[0.06] px-1.5 py-0.5 font-mono text-[10.5px] text-slate-300">index.html</code>.
            </p>
            <div className="mt-3 flex flex-wrap gap-2">
              {(RESOURCES[module.id] || []).map((resource) => (
                <a
                  key={resource.file}
                  href={resource.file}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[11.5px] font-medium text-slate-200 transition hover:border-white/20 hover:bg-white/[0.06]"
                >
                  <Icon name="arrowRight" className="h-3.5 w-3.5" />
                  {resource.type}: {resource.file}
                </a>
              ))}
              {module.videos && module.videos.map((video) => (
                <span
                  key={video.src}
                  className="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.02] px-3.5 py-2 text-[11.5px] font-medium text-slate-400"
                  title="Video de la clase (debe estar en la misma carpeta)"
                >
                  <Icon name="video" className="h-3.5 w-3.5" />
                  Video: {video.src}
                </span>
              ))}
            </div>
          </div>

          <TheorySection
            module={module}
            watchedTheory={status.theory}
            onMark={() => actions.markTheory(module.id)}
            feynman={progress.feynman[module.id] || ''}
            onFeynman={(text) => actions.saveFeynman(module.id, text)}
          />

          <VideoSection
            module={module}
            watched={status.video}
            onWatched={() => actions.markVideo(module.id)}
          />

          <QuizSection
            module={module}
            bestScore={status.score}
            onScore={(score) => actions.recordQuiz(module.id, score)}
          />

          <div className="mt-14 flex flex-col-reverse gap-3 border-t border-white/[0.07] pt-6 sm:flex-row sm:items-center sm:justify-between">
            {previous ? (
              <button
                onClick={() => actions.goTo(previous.id)}
                className="inline-flex items-center justify-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-4 py-2.5 text-[12px] font-medium text-slate-300 transition hover:border-white/20 hover:bg-white/[0.06]"
              >
                <Icon name="arrowLeft" className="h-3.5 w-3.5" /> {previous.short}
              </button>
            ) : (
              <span />
            )}

            <span className="text-center text-[10px] font-medium uppercase tracking-[0.16em] text-slate-600">
              {index + 1} / {MODULES.length} módulos
            </span>

            {next ? (
              <button
                onClick={() => actions.goTo(next.id)}
                className="inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-[12px] font-semibold text-[#05080C] transition hover:brightness-110 active:scale-[0.99]"
                style={{ backgroundColor: accent }}
              >
                Siguiente: {next.short} <Icon name="arrowRight" className="h-3.5 w-3.5" />
              </button>
            ) : (
              <span className="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-400/10 px-4 py-2.5 text-[12px] font-semibold text-emerald-300 ring-1 ring-inset ring-emerald-400/20">
                <Icon name="check" className="h-3.5 w-3.5" /> Fin de la ruta
              </span>
            )}
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  Modal de reinicio                                                  */
    /* ------------------------------------------------------------------ */

    function ResetModal({ onCancel, onConfirm }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm animate-fade" role="dialog" aria-modal="true" aria-labelledby="reset-title">
          <div className="w-full max-w-sm animate-rise rounded-2xl border border-white/10 bg-[#0B1219] p-5 shadow-soft">
            <div className="grid h-10 w-10 place-items-center rounded-xl bg-rose-400/10 text-rose-300 ring-1 ring-inset ring-rose-400/20">
              <Icon name="alert" className="h-5 w-5" />
            </div>
            <h2 id="reset-title" className="mt-4 text-[17px] font-bold text-white">¿Reiniciar toda tu ruta?</h2>
            <p className="mt-1.5 text-[12px] leading-relaxed text-slate-500">
              Se borrarán el progreso, las notas de Feynman y tus mejores puntajes en este navegador. No se puede deshacer.
            </p>
            <div className="mt-5 flex gap-2">
              <button
                onClick={onCancel}
                className="flex-1 rounded-xl border border-white/10 bg-white/[0.03] px-3 py-2.5 text-[12px] font-medium text-slate-300 transition hover:bg-white/[0.07]"
              >
                Cancelar
              </button>
              <button
                onClick={onConfirm}
                className="flex-1 rounded-xl bg-rose-500/90 px-3 py-2.5 text-[12px] font-semibold text-white transition hover:bg-rose-400"
              >
                Sí, reiniciar
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  App                                                                */
    /* ------------------------------------------------------------------ */

    function App() {
      const [progress, setProgress] = useState(loadProgress);
      const [activeId, setActiveId] = useState(() => {
        try {
          const savedModule = localStorage.getItem(MODULE_KEY);
          return MODULES.some((module) => module.id === savedModule) ? savedModule : MODULES[0].id;
        } catch (error) {
          return MODULES[0].id;
        }
      });
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [resetOpen, setResetOpen] = useState(false);

      const active = MODULES.find((module) => module.id === activeId) || MODULES[0];

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        } catch (error) {
          /* El progreso sigue en memoria aunque el navegador bloquee localStorage. */
        }
      }, [progress]);

      useEffect(() => {
        document.body.style.overflow = sidebarOpen || resetOpen ? 'hidden' : '';
        return () => { document.body.style.overflow = ''; };
      }, [sidebarOpen, resetOpen]);

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        try {
          localStorage.setItem(MODULE_KEY, activeId);
        } catch (error) {
          /* Sin persistencia del módulo si el navegador bloquea localStorage. */
        }
      }, [activeId]);

      const status = useMemo(() => {
        const result = {};

        MODULES.forEach((module) => {
          const quiz = progress.quiz[module.id];
          const best = quiz && typeof quiz.best === 'number' ? quiz.best : null;
          const requiredKeys = module.videoOptional ? ['theory', 'quiz'] : ['theory', 'video', 'quiz'];

          const entry = {
            theory: !!progress.theory[module.id],
            video: !!progress.video[module.id],
            quiz: best !== null && best >= PASS_SCORE,
            score: best,
            requiredKeys,
            total: requiredKeys.length
          };

          entry.count = requiredKeys.filter((key) => entry[key]).length;
          entry.done = entry.count === entry.total;
          result[module.id] = entry;
        });

        return result;
      }, [progress]);

      const doneSteps = useMemo(
        () => MODULES.reduce((total, module) => total + status[module.id].count, 0),
        [status]
      );
      const percent = Math.round((doneSteps / TOTAL_STEPS) * 100);

      const actions = useMemo(() => ({
        markTheory(id) {
          setProgress((previous) => ({
            ...previous,
            theory: { ...previous.theory, [id]: true }
          }));
        },
        markVideo(id) {
          setProgress((previous) => ({
            ...previous,
            video: { ...previous.video, [id]: true }
          }));
        },
        recordQuiz(id, score) {
          setProgress((previous) => {
            const previousQuiz = previous.quiz[id] || { best: 0, attempts: 0 };
            return {
              ...previous,
              quiz: {
                ...previous.quiz,
                [id]: {
                  best: Math.max(previousQuiz.best || 0, score),
                  last: score,
                  attempts: (previousQuiz.attempts || 0) + 1
                }
              }
            };
          });
        },
        saveFeynman(id, text) {
          setProgress((previous) => ({
            ...previous,
            feynman: { ...previous.feynman, [id]: text }
          }));
        },
        goTo(id) {
          setActiveId(id);
          setSidebarOpen(false);
        }
      }), []);

      function resetAll() {
        setProgress(emptyProgress());
        try {
          localStorage.removeItem(MODULE_KEY);
        } catch (error) {
          /* Nada que limpiar si localStorage no está disponible. */
        }
        setActiveId(MODULES[0].id);
        setResetOpen(false);
        setSidebarOpen(false);
      }

      return (
        <div className="min-h-screen bg-ink-950">
          <div
            className="pointer-events-none fixed inset-0 z-0"
            style={{
              background:
                'radial-gradient(1100px 560px at 18% -12%, rgba(56,189,248,.07), transparent 60%), radial-gradient(900px 520px at 92% 6%, rgba(167,139,250,.055), transparent 62%), radial-gradient(800px 500px at 60% 100%, rgba(52,211,153,.04), transparent 62%)'
            }}
            aria-hidden="true"
          />

          <Sidebar
            activeId={activeId}
            onSelect={(id) => actions.goTo(id)}
            status={status}
            percent={percent}
            doneSteps={doneSteps}
            onReset={() => setResetOpen(true)}
            open={sidebarOpen}
            onClose={() => setSidebarOpen(false)}
          />

          <div className="relative z-10 lg:pl-[302px]">
            <header className="sticky top-0 z-20 border-b border-white/[0.06] bg-[#05080C]/80 backdrop-blur-xl">
              <div className="flex h-16 items-center gap-3 px-4 sm:px-8">
                <button
                  onClick={() => setSidebarOpen(true)}
                  className="grid h-9 w-9 place-items-center rounded-lg border border-white/10 bg-white/[0.03] text-slate-400 transition hover:bg-white/[0.07] hover:text-white lg:hidden"
                  aria-label="Abrir menú"
                >
                  <Icon name="menu" className="h-4 w-4" />
                </button>

                <div className="flex min-w-0 items-center gap-2 text-[11px]">
                  <span className="hidden text-slate-500 sm:inline">Redes 2</span>
                  <Icon name="chevronRight" className="hidden h-3 w-3 text-slate-700 sm:block" />
                  <span className="font-semibold text-slate-200">Módulo {active.n}</span>
                  <span className="hidden truncate text-slate-500 md:inline">· {active.title}</span>
                </div>

                <div className="ml-auto flex items-center gap-3">
                  <div className="hidden items-center gap-2 sm:flex">
                    <span className="text-[9px] font-semibold uppercase tracking-[0.14em] text-slate-600">Ruta</span>
                    <div className="h-1.5 w-24 overflow-hidden rounded-full bg-white/10">
                      <div
                        className="h-full rounded-full bg-gradient-to-r from-sky-400 via-violet-400 to-emerald-400 transition-all duration-700"
                        style={{ width: percent + '%' }}
                      />
                    </div>
                    <span className="w-8 text-right text-[10.5px] font-semibold tabular-nums text-slate-400">{percent}%</span>
                  </div>

                  <button
                    onClick={() => setResetOpen(true)}
                    className="grid h-8 w-8 place-items-center rounded-lg text-slate-500 transition hover:bg-white/5 hover:text-slate-200"
                    aria-label="Reiniciar progreso"
                    title="Reiniciar progreso"
                  >
                    <Icon name="rotate" className="h-4 w-4" />
                  </button>
                </div>
              </div>
            </header>

            <main className="mx-auto max-w-[980px] px-4 pb-20 pt-7 sm:px-8 sm:pt-10">
              <ModuleView
                key={active.id}
                module={active}
                status={status[active.id]}
                progress={progress}
                actions={actions}
              />

              <footer className="mt-12 flex flex-col items-center justify-between gap-2 border-t border-white/[0.05] pt-5 text-[9.5px] text-slate-600 sm:flex-row">
                <span>Redes 2 · Microlearning + Feynman + Active Recall</span>
                <span className="inline-flex items-center gap-1.5">
                  <Icon name="route" className="h-3 w-3" /> {doneSteps}/{TOTAL_STEPS} pasos · guardado local
                </span>
              </footer>
            </main>
          </div>

          {resetOpen && <ResetModal onCancel={() => setResetOpen(false)} onConfirm={resetAll} />}
        </div>
      );
    }

    const container = document.getElementById('root');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>
</html>
